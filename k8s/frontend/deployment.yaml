apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotes-frontend-deployment
  namespace: frontend 
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: quotes-frontend
  template:
    metadata:
      labels:
        app: quotes-frontend
    spec:
      containers:
        - name: quotes-frontend
          image: docker.io/anilpandeyio/k8s-three-tier-starter-app:v1.0.6 # kept in sync with VERSION by CI (ci.yml)
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
          - name: API_URL
            value: http://api.backend.svc.cluster.local:5001
          - name: SERVICE_NAME
            value: quotes-frontend
          - name: LOG_DIR
            value: /var/log/quotes-app
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/quotes-app
      # Node-local directory shared with the Fluent Bit DaemonSet (which
      # mounts the node's /var/log read-only) so each pod's structured log
      # file, written under /var/log/quotes-app, can be tailed from the host.
      volumes:
        - name: app-logs
          hostPath:
            path: /var/log/quotes-app
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: quotes-frontend-service
  namespace: frontend 
spec:
  selector:
    app: quotes-frontend
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002 
  type: ClusterIP 