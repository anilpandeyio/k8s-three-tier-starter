apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  namespace: frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/use-regex: "true"
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
  # No 'host' set: matches any Host header, so it works via port-forward
  # to localhost without needing hosts-file entries or a stable node IP.
  - http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: quotes-frontend-service
            port: 
              number: 5002 