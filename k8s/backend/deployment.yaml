apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotes-api-deployment
  namespace: backend
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: quotes-api
  template:
    metadata:
      labels:
        app: quotes-api
    spec:
      containers:
        - name: quotes-api
          image: docker.io/anilpandeyio/k8s-three-tier-starter-api:v1.0.9 # kept in sync with VERSION by CI (ci.yml)
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: mysql-secret
            - configMapRef:
                name: mysql-config
          env:
            - name: SERVICE_NAME
              value: quotes-api
            - name: LOG_DIR
              value: /var/log/quotes-app
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/quotes-app
      # Node-local directory shared with the Fluent Bit DaemonSet (which
      # mounts the node's /var/log read-only) so each pod's structured log
      # file, written under /var/log/quotes-app, can be tailed from the host.
      volumes:
        - name: app-logs
          hostPath:
            path: /var/log/quotes-app
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: backend
spec:
  selector:
    app: quotes-api
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001