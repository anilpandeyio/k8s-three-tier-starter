apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotes-api-deployment
  namespace: backend
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: quotes-api
  template:
    metadata:
      labels:
        app: quotes-api
    spec:
      containers:
        - name: quotes-api
          image: docker.io/anilpandeyio/k8s-three-tier-starter-api:latest
          imagePullPolicy: Always # always pull the latest image from Docker Hub
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: mysql-secret
            - configMapRef:
                name: mysql-config

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: backend
spec:
  selector:
    app: quotes-api
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001