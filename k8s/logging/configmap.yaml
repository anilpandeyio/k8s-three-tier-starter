apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush           5
        Log_Level       info
        Daemon          off
        Parsers_File    parsers.conf
        HTTP_Server     On
        HTTP_Listen     0.0.0.0
        HTTP_Port       2020

    # Tails every container log file on the node. Kubernetes writes one file
    # per container under /var/log/containers (symlinked from /var/log/pods),
    # so this is how the DaemonSet "reads data from the log file".
    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/containers/*.log
        multiline.parser    docker, cri
        DB                  /fluent-bit/output/flb_kube.db
        Mem_Buf_Limit       5MB
        Skip_Long_Lines     On
        Refresh_Interval    10

    # Tails the structured JSON log files the Quotes API/frontend write to
    # their shared hostPath volume (/var/log/quotes-app, mounted into this
    # DaemonSet via the read-only /var/log hostPath already defined below).
    [INPUT]
        Name                tail
        Tag                 app.*
        Path                /var/log/quotes-app/*.log
        Path_Key            source_file
        Parser              json_app
        DB                  /fluent-bit/output/flb_app.db
        Mem_Buf_Limit       5MB
        Skip_Long_Lines     On
        Refresh_Interval    10

    # Enriches each record with pod/namespace/labels metadata from the
    # Kubernetes API so the aggregated output can be filtered/searched later.
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # Writes the parsed/enriched records to a file on the shared volume
    # mounted at /fluent-bit/output (backed by the PVC), for later
    # inspection (e.g. kubectl exec + cat, or mounting the PVC elsewhere).
    # Kept outside /var/log because that hostPath mount is read-only.
    [OUTPUT]
        Name    file
        Match   kube.*
        Path    /fluent-bit/output
        File    aggregated-pods.log
        Format  plain

    # Same idea, for the app-written structured log files.
    [OUTPUT]
        Name    file
        Match   app.*
        Path    /fluent-bit/output
        File    aggregated-app.log
        Format  plain

    # Ships the enriched container logs to Loki. auto_kubernetes_labels only
    # promotes the pod's own labels (e.g. app=...); namespace/pod/container
    # identity must be added explicitly via Label_keys so streams can be
    # queried in LogQL as {namespace="backend", pod="...", container="..."}.
    [OUTPUT]
        Name                    loki
        Match                   kube.*
        Host                    loki.logging.svc.cluster.local
        Port                    3100
        Labels                  job=fluent-bit, source=kube-containers
        auto_kubernetes_labels  on
        Label_keys              $kubernetes['namespace_name'], $kubernetes['pod_name'], $kubernetes['container_name']
        Line_format             json

    # Ships the app-written structured JSON logs to Loki as a second stream,
    # labeled by the "service" field the logger embeds in every line.
    [OUTPUT]
        Name          loki
        Match         app.*
        Host          loki.logging.svc.cluster.local
        Port          3100
        Labels        job=fluent-bit, source=app-file
        Label_keys    $service
        Line_format   json

  parsers.conf: |
    # Parses the single-line JSON records written by the Quotes API/frontend
    # logger (api/src/logger.js, app/src/logger.js) to /var/log/quotes-app.
    [PARSER]
        Name          json_app
        Format        json
        Time_Key      time
        Time_Format   %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep     On

