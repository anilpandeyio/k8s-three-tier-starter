# ==== For Development works ======
version: '3.9'

services:
  db:
    container_name: quotes-db
    image: ${DOCKERHUB_USER:-anilpandeyio}/k8s-three-tier-starter-db:latest
    build: ./db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quotesdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db-data:/var/lib/mysql

  api:
    container_name: quotes-api
    image: ${DOCKERHUB_USER:-anilpandeyio}/k8s-three-tier-starter-api:latest
    build: ./api
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DB: quotesdb
    ports:
      - "5001:5001"

  app:
    container_name: quotes-frontend
    image: ${DOCKERHUB_USER:-anilpandeyio}/k8s-three-tier-starter-app:latest
    build: ./app
    depends_on:
      - api
    environment:
      API_URL: http://api:5001
    ports:
      # - "80:5000" # for beanstalk
      - "5002:5002"

volumes:
  db-data:
