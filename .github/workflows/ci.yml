name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # lets the release job commit the published version and manifest tags

jobs:
  version:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: resolve
        # PRs get a traceable commit-sha tag; pushes get the next VERSION tag.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            current=$(cat VERSION)
            IFS='.' read -r major minor patch <<< "$current"
            echo "tag=v$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

  api:
    name: API - build, test & validate
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-three-tier-starter-api:${{ needs.version.outputs.tag }}

  app:
    name: App - build, test & validate
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-three-tier-starter-app:${{ needs.version.outputs.tag }}

  update-manifests:
    name: Publish version and pin manifests
    # Commit the version only after every image using it has been published.
    if: github.event_name == 'push'
    needs: [version, api, app, db]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set version and image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          echo "${tag#v}" > VERSION
          sed -i -E "s#(image: docker.io/)[^/]+/(k8s-three-tier-starter-api):[^\"[:space:]]+#\1${DOCKERHUB_USERNAME}/\2:${tag}#" k8s/backend/deployment.yaml
          sed -i -E "s#(image: docker.io/)[^/]+/(k8s-three-tier-starter-app):[^\"[:space:]]+#\1${DOCKERHUB_USERNAME}/\2:${tag}#" k8s/frontend/deployment.yaml

      - name: Commit and push version and manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION k8s/backend/deployment.yaml k8s/frontend/deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish version ${{ needs.version.outputs.tag }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

  db:
    name: DB - build & validate
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: db
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-three-tier-starter-db:${{ needs.version.outputs.tag }}
