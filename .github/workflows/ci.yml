name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # lets the "version" job commit the bumped VERSION file back to main

jobs:
  version:
    name: Resolve image tag / bump version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump VERSION file on merges to main
        if: github.event_name == 'push'
        id: bump
        run: |
          current=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$current"
          new_version="$major.$minor.$((patch + 1))"
          echo "$new_version" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: bump version to v$new_version [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: resolve
        # PRs get a traceable commit-sha tag; merges to main get the freshly bumped version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=v${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

  api:
    name: API - build, test & validate
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-three-tier-starter-api:${{ needs.version.outputs.tag }}

  app:
    name: App - build, test & validate
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-three-tier-starter-app:${{ needs.version.outputs.tag }}

  update-manifests:
    name: Pin k8s manifests to the new image tag
    # Only on merges to main: the version job bumped VERSION and pushed
    # versioned images; now pin the manifests to that same tag so clusters
    # pick up the new images without the old (unmanaged) :latest tag.
    if: github.event_name == 'push'
    needs: [version, api, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set image tags in manifests
        run: |
          tag="${{ needs.version.outputs.tag }}"
          sed -i -E "s#(k8s-three-tier-starter-api):[^\"[:space:]]+#\1:${tag}#" k8s/backend/deployment.yaml
          sed -i -E "s#(k8s-three-tier-starter-app):[^\"[:space:]]+#\1:${tag}#" k8s/frontend/deployment.yaml

      - name: Commit and push manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/deployment.yaml k8s/frontend/deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "ci: pin k8s manifests to ${{ needs.version.outputs.tag }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

  db:
    name: DB - build & validate
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: db
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-three-tier-starter-db:${{ needs.version.outputs.tag }}

